services:
  postgres:
    image: postgres:16-alpine
    container_name: lawawa-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: lawawa
      POSTGRES_PASSWORD: lawawa
      POSTGRES_DB: lawawa
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
